<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Advanced To Do App</title>

    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:#f2f2f2;
            font-family:Arial;
            transition:0.3s;
        }

        /* CENTER */

        .main{

            width:100%;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

        }

        /* BOX */

        .box{

            width:100%;

            max-width:700px;

            background:white;

            padding:20px;

            border-radius:15px;

            box-shadow:0px 0px 15px #ccc;

            transition:0.3s;

        }

        /* TASK CARD */

        .task-card{

            background:#f8f9fa;

            padding:15px;

            border-radius:12px;

            margin-top:15px;

            transition:0.3s;

        }

        /* COMPLETED */

        .completed{

            text-decoration:line-through;

            opacity:0.7;

        }

        /* DARK MODE */

        .dark{

            background:#121212;

            color:white;

        }

        .dark .box{

            background:#1e1e1e;

            color:white;

        }

        .dark .task-card{

            background:#2b2b2b;

            color:white;

        }

        .dark input,
        .dark select{

            background:#333 !important;

            color:white !important;

            border:none !important;

        }

        .dark input::placeholder{

            color:#ccc;

        }

        /* PRIORITY */

        .high{

            color:red;

            font-weight:bold;

        }

        .medium{

            color:orange;

            font-weight:bold;

        }

        .low{

            color:green;

            font-weight:bold;

        }

        /* MOBILE */

        @media(max-width:600px){

            .box{

                padding:15px;

            }

            h2{

                font-size:24px;

            }

        }

    </style>

</head>

<body id="body">

<div class="main">

<div class="box">

    <!-- HEADER -->

    <div class="d-flex
        justify-content-between
        align-items-center">

        <h2>
             Advanced To Do App
        </h2>

        <!-- DARK MODE -->

        <button
            class="btn btn-dark"
            onclick="darkMode()">

            🌙

        </button>

    </div>

    <p class="mt-2">
        Manage Your Daily Tasks Easily
    </p>

    <!-- TASK -->

    <input
        type="text"
        id="task"
        class="form-control mt-3"
        placeholder="Enter Task">

    <!-- DATE -->

    <input
        type="date"
        id="date"
        class="form-control mt-3">

    <!-- PRIORITY -->

    <select
        id="priority"
        class="form-select mt-3">

        <option>High</option>

        <option>Medium</option>

        <option>Low</option>

    </select>

    <!-- BUTTONS -->

    <div class="d-grid gap-2 mt-3">

        <!-- ADD TASK -->

        <button
            class="btn btn-primary "
            onclick="addTask()">

            ➕ Add Task

        </button>

        <!-- VOICE -->

        <button
            class="btn btn-success "
            onclick="startVoice()">

            🎤 Voice Add Task

        </button>

    </div>

    <!-- SEARCH -->

    <input
        type="text"
        id="search"
        class="form-control mt-4"
        placeholder="Search Task"
        onkeyup="searchTask()">

    <!-- TASK LIST -->

    <div id="taskList"></div>

</div>

</div>

<script>

/* TASK ARRAY */

let tasks =
    JSON.parse(
        localStorage.getItem("tasks")
    ) || [];

/* LOAD TASKS */

showTasks(tasks);

/* DARK MODE */

let dark = false;

function darkMode(){

    let body =
        document.getElementById("body");

    if(dark == false){

        body.classList.add("dark");

        dark = true;

    }

    else{

        body.classList.remove("dark");

        dark = false;

    }

}

/* SAVE TASKS */

function saveTasks(){

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

}

/* ADD TASK */

function addTask(){

    let task =
        document
        .getElementById("task")
        .value
        .trim();

    let date =
        document
        .getElementById("date")
        .value;

    let priority =
        document
        .getElementById("priority")
        .value;

    /* EMPTY */

    if(task == "" || date == ""){

        alert(
            "Please Fill All Fields"
        );

        return;

    }

    /* OBJECT */

    let todo = {

        task:task,

        date:date,

        priority:priority,

        completed:false

    };

    /* PUSH */

    tasks.push(todo);

    /* SAVE */

    saveTasks();

    /* SHOW */

    showTasks(tasks);

    /* CLEAR */

    document
        .getElementById("task")
        .value = "";

    document
        .getElementById("date")
        .value = "";

}

/* SHOW TASKS */

function showTasks(data){

    let list =
        document
        .getElementById("taskList");

    list.innerHTML = "";

    data.forEach((todo, index) => {

        let priorityClass = "";

        if(todo.priority == "High"){

            priorityClass = "high";

        }

        else if(todo.priority == "Medium"){

            priorityClass = "medium";

        }

        else{

            priorityClass = "low";

        }

        list.innerHTML += `

        <div class="task-card
            ${todo.completed ? 'completed' : ''}">

            <h5>
                 ${todo.task}
            </h5>

            <p>
                 ${todo.date}
            </p>

            <p class="${priorityClass}">
                 ${todo.priority}
            </p>

            <p>
                ${
                    todo.completed
                    ?
                    " Completed"
                    :
                    " Pending"
                }
            </p>

            <!-- BUTTONS -->

            <div class="d-flex
                gap-2
                flex-wrap">

                <!-- COMPLETE -->

                <button
                    class="btn btn-success"
                    onclick="completeTask(${index})">

                     Complete

                </button>

                <!-- EDIT -->

                <button
                    class="btn btn-warning"
                    onclick="editTask(${index})">

                     Edit

                </button>

                <!-- DELETE -->

                <button
                    class="btn btn-danger"
                    onclick="deleteTask(${index})">

                     Delete

                </button>

            </div>

        </div>

        `;

    });

}

/* COMPLETE */

function completeTask(index){

    tasks[index].completed =
        !tasks[index].completed;

    saveTasks();

    showTasks(tasks);

}

/* DELETE */

function deleteTask(index){

    tasks.splice(index,1);

    saveTasks();

    showTasks(tasks);

}

/* EDIT */

function editTask(index){

    let newTask = prompt(
        "Edit Task",
        tasks[index].task
    );

    if(
        newTask != null &&
        newTask.trim() != ""
    ){

        tasks[index].task =
            newTask;

        saveTasks();

        showTasks(tasks);

    }

}

/* SEARCH */

function searchTask(){

    let value =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    let filtered =
        tasks.filter(todo =>

            todo.task
            .toLowerCase()
            .includes(value)

        );

    showTasks(filtered);

}

/* VOICE ADD */

function startVoice(){

    /* CHECK SUPPORT */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice Recognition Not Supported In This Browser"
        );

        return;

    }

    let recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.start();

    /* START */

    recognition.onstart = function(){

        alert(
            "🎤 Speak Now..."
        );

    };

    /* RESULT */

    recognition.onresult =
    function(event){

        let voiceText =
            event.results[0][0]
            .transcript;

        document
        .getElementById("task")
        .value = voiceText;

    };

    /* ERROR */

    recognition.onerror =
    function(){

        alert(
            "Microphone Permission Denied"
        );

    };

}

</script>

</body>

</html>
